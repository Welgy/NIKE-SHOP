<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Официальный сайт Nike. Вдохновляйся и покупай лучшие кроссовки.">
    <title>Nike. Just Do It.</title>
    
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Навигация -->
    <header class="global-nav">
        <nav class="nav-content">
            <ul class="nav-links">
                <li><a href="#" class="nav-logo">Nike</a></li>
                <li><a href="#">Мужчинам</a></li>
                <li><a href="#">Женщинам</a></li>
                <li><a href="#">Детям</a></li>
                <li><a href="#">Распродажа</a></li>
            </ul>
            <div class="nav-actions">
                <a href="#">Поиск</a>
                <a href="#">Корзина (0)</a>
            </div>
        </nav>
    </header>

    <!-- Основной контент -->
    <main>
        
        <!-- 1. Главный баннер (Bento-сетка) -->
        <section class="bento-grid reveal">
            <!-- Единая картинка-баннер -->
            <img src="assets/hero-banner.jpg" alt="Nike Banner" class="bento-bg-image">
            
            <!-- Живой текст поверх картинки -->
            <div class="bento-overlay">
                <div class="bento-text-block">
                    <h2>Your next pair is here.</h2>
                    <p>Step up your game with the latest drops.</p>
                    <a href="#" class="btn-primary">Shop now</a>
                </div>
            </div>
        </section>

         <!-- Разделитель с призывом к скроллу -->
        <div class="scroll-prompt reveal">
            <h3>Discover the Icons</h3>
            <div class="arrow-down">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V20M12 20L18 14M12 20L6 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

    <section class="hero reveal">
            <!-- Левая часть: Текст и кнопки -->
            <div class="hero-text">
                <h1 class="hero-title">Air Jordan 1</h1>
                <p class="hero-subtitle">Timeless design. Unmatched legacy.</p>
                <div class="hero-buttons">
                    <a href="#" class="btn-outline">Learn more</a>
                    <a href="#" class="btn-primary">Buy</a>
                </div>
            </div>
            
            <!-- Правая часть: Картинка -->
            <div class="hero-image-wrapper">
                <div class="image-slider">
                    <img src="assets/front-img.webp" alt="Jordan 1 Black White" class="slide active">
                    <img src="assets/front-img2.jpg" alt="Jordan 1 Orange" class="slide">
                    <img src="assets/front-img3.jpg" alt="Jordan 1 Red" class="slide">
                    <img src="assets/front-img4.jpg" alt="Jordan 1 Burgundy" class="slide">
                    <img src="assets/front-img5.jpg" alt="Jordan 1 Blue" class="slide">
                </div>
            </div>
            
        </section>

    </main>

    <!-- Подключаем скрипты -->
    <script src="js/script.js" defer></script>
</body>
</html>
